name: Verify Nix packaging

# Upstream CI (verify-pr.yml) exercises the npm build only, so nothing catches a
# Nix packaging regression until someone tries to `nix run` the app. This job closes
# that gap: an upstream sync that changes package-lock.json invalidates the pinned
# npmDepsHash, and that should fail here rather than on someone's machine.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Cache Nix store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package
        run: nix build --print-build-logs --no-link .#default

      - name: Assert mainProgram is runnable
        run: nix eval --raw .#default.meta.mainProgram | grep -qx ompweb